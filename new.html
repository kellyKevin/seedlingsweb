<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Data from Firestore</title>
    <link rel="stylesheet" href="test.css">
    <style>
        /* Add your CSS styles here */

        /* Modal container, hidden by default */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1;
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgb(0, 0, 0);
            /* Fallback color */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
        }

        /* Modal content */
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            /* Could be more or less, depending on screen size */
        }

        /* Close button */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 a {
            text-decoration: none;
            color: #000000;
            transition: color 0.3s;
        }

        h1 a:hover {
            color: #0cd527cc;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 a {
            text-decoration: none;
            color: #0cd527;
            transition: color 0.3s;
        }

        h2 a:hover {
            color: #0cd527cc;
        }

        h3 {
            text-align: center;
            margin-bottom: 30px;
        }

        h3 a {
            text-decoration: none;
            color: #000000;
            transition: color 0.3s;
        }

        h3 a:hover {
            color: #0cd527cc;
        }
    </style>
</head>

<body>

    <div class="selector">
        <h3><a href="index.html">Home Page</a></h3>
        <h1><a href="cart.html">View Cart</a></h1>
        <h2><label for="collection-select">Choose a collection:</label>
            <select id="collection-select">
                <option value="fruits">Fruits</option>
                <option value="trees">Trees</option>
                <option value="veges">Vegetables</option>
            </select>
            <button id="fetch-button">Fetch Data</button>
    </div>
    </h2>

    <div class="container" id="data-container">
        <!-- Data will be inserted here -->
    </div>

    <!-- Modal for Shopping Cart -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-cart">&times;</span>
            <h3>Shopping Cart</h3>
            <div id="cart-items">
                <!-- Cart items will be inserted here -->
            </div>
            <div class="cart-total" id="cart-total">Total: ksh0.00</div>
        </div>
    </div>

    <!-- Modal for displaying additional images -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-image">&times;</span>
            <div id="modal-images">
                <!-- Images will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK and main JavaScript -->
    <script type="module">
        // Import Firebase
        import { db, auth } from "./firebase-config.js";
        import { collection, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Initialize cart array from localStorage
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("User signed in: ", user);
            } else {
                currentUser = null;
                console.log("No user signed in.");
            }
        });

        // Variable to hold the unsubscribe function for real-time updates
        let unsubscribe = null;

        // Function to create a card element
        function createCard(docId, data, collectionName) {
            const imgSrc = data.imagetree1 || 'placeholder.jpg';
            const description = data.Description || 'No description available';
            const price = data.price || 0;
            const stock = data.stock !== undefined ? data.stock : 'N/A';
            const stockDisplay = data.stock !== undefined ? `Stock: ${data.stock}` : 'Stock info unavailable';

            return `
                <div class="card">
                    <img src="${imgSrc}" alt="${description}" onclick="showModal('${data.imagetree1}', '${data.imagetree2}', '${data.imagetree3}')">
                    <div class="card-title">${docId}</div>
                    <div class="card-desc">${description}</div>
                    <div class="card-stock" style="font-weight: bold; color: ${data.stock > 0 ? 'green' : 'red'};">${stockDisplay}</div>
                    <button onclick="removeFromCart('${docId}', '${data.name || docId}')">Remove</button>
                    <div class="card-price">ksh${price.toFixed(2)}</div>
                    <button onclick="addToCart('${docId}', '${docId}', ${price}, '${imgSrc}', '${collectionName}')" ${data.stock <= 0 ? 'disabled' : ''}>${data.stock <= 0 ? 'Out of Stock' : 'Add to Cart'}</button>
                </div>
            `;
        }

        // Fetch and display data from the collection with real-time updates
        function displayCollection(collectionName, containerId) {
            const container = document.getElementById(containerId);

            // Unsubscribe from previous listener if it exists
            if (unsubscribe) {
                unsubscribe();
            }

            console.log(`Listening for real-time updates from collection: ${collectionName}`);

            unsubscribe = onSnapshot(collection(db, collectionName), (querySnapshot) => {
                container.innerHTML = '';
                if (querySnapshot.empty) {
                    container.innerHTML = `<p>No data found in the ${collectionName} collection.</p>`;
                } else {
                    querySnapshot.forEach((doc) => {
                        container.innerHTML += createCard(doc.id, doc.data(), collectionName);
                    });
                }
            }, (error) => {
                console.error(`Error listening to ${collectionName}:`, error);
                container.innerHTML = `<p>Error loading data. Please try again later.</p>`;
            });
        }

        // Event listener for the fetch button
        document.getElementById('fetch-button').addEventListener('click', () => {
            const collectionSelect = document.getElementById('collection-select');
            const selectedCollection = collectionSelect.value.trim(); // Trim to remove extra spaces
            displayCollection(selectedCollection, 'data-container');
        });

        // Initially display the first collection
        displayCollection("fruits ", "data-container");

        // Function to show the modal with images
        window.showModal = function (img1 = 'placeholder.jpg', img2 = 'placeholder.jpg', img3 = 'placeholder.jpg') {
            const modal = document.getElementById('imageModal');
            const modalImages = document.getElementById('modal-images');
            modalImages.innerHTML = `
                <img src="${img1}" alt="Image 1">
                <img src="${img2}" alt="Image 2">
                <img src="${img3}" alt="Image 3">
            `;
            modal.classList.add('active');
        };

        // Close modal
        document.getElementById('close-image').onclick = function () {
            document.getElementById('imageModal').classList.remove('active');
        };

       // Function to add item to cart
window.addToCart = async function (itemId, itemName, itemPrice, itemImage, collectionName) {
    if (!currentUser) {
        alert("Please log in to add items to your cart.");
        return;
    }

    try {
        // Fetch the latest stock from Firestore to prevent overselling
        const docRef = doc(db, collectionName, itemId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
            alert("Product no longer exists.");
            return;
        }

        const productData = docSnap.data();
        const availableStock = productData.stock !== undefined ? productData.stock : Infinity;

        if (availableStock <= 0) {
            alert("Sorry, this item is out of stock.");
            return;
        }

        const quantityToAdd = prompt(`Enter quantity to add for ${itemName} (Available: ${availableStock}):`, '1');
        if (quantityToAdd === null || quantityToAdd === '') {
            return;
        }
        const parsedQuantity = parseInt(quantityToAdd, 10);
        if (isNaN(parsedQuantity) || parsedQuantity <= 0) {
            alert("Invalid quantity. Please enter a valid number greater than zero.");
            return;
        }

        // Check if the total quantity in cart would exceed available stock
        const existingItemIndex = cart.findIndex(i => i.id === itemId);
        const currentCartQuantity = existingItemIndex !== -1 ? cart[existingItemIndex].quantity : 0;

        if (currentCartQuantity + parsedQuantity > availableStock) {
            alert(`Cannot add ${parsedQuantity} more. You already have ${currentCartQuantity} in cart, and only ${availableStock} are available in stock.`);
            return;
        }

        const item = {
            id: itemId,
            name: itemName,
            price: itemPrice,
            image: itemImage,
            quantity: parsedQuantity,
            collection: collectionName, // Keep track of collection for inventory updates
            addedBy: currentUser.email
        };

        if (existingItemIndex !== -1) {
            cart[existingItemIndex].quantity += parsedQuantity;
        } else {
            cart.push(item);
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();

        // Update Firestore document under 'carts/userId'
        const cartItems = cart.map(cartItem => ({
            id: cartItem.id,
            name: cartItem.name,
            price: cartItem.price,
            image: cartItem.image,
            quantity: cartItem.quantity,
            collection: cartItem.collection || collectionName,
            addedBy: cartItem.addedBy
        }));

        await setDoc(doc(db, "carts", currentUser.uid), {
            items: cartItems
        });

        console.log("Cart updated in Firestore");
        alert(`${parsedQuantity} ${parsedQuantity > 1 ? 'items' : 'item'} added to cart for user: ${currentUser.email}`);
    } catch (error) {
        console.error("Error updating cart:", error);
        alert("An error occurred while adding the item to the cart.");
    }
};

        // Function to display cart items and calculate total
        function displayCart() {
            const cartContainer = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            let total = 0;

            cartContainer.innerHTML = '';

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const cartItemHTML = `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div>
                            <h4>${item.name}</h4>
                            <p>Price: ksh${item.price.toFixed(2)} | Quantity: ${item.quantity}</p>
                        </div>
                        <div class="quantity">
                            <button class="btn" onclick="removeFromCart('${item.id}', '${item.name}')">Remove</button>
                        </div>
                    </div>
                `;
                cartContainer.innerHTML += cartItemHTML;
            });

            cartTotal.textContent = `Total: ksh${total.toFixed(2)}`;
        }

        // Function to remove item from cart
window.removeFromCart = async function (itemId, itemName) {
    if (!currentUser) {
        alert("Please log in to modify your cart.");
        return;
    }

    const index = cart.findIndex(i => i.id === itemId);
    if (index !== -1) {
        const currentQuantity = cart[index].quantity;
        const quantityToRemove = prompt(`Enter quantity to remove for ${itemName || cart[index].name} (Current quantity: ${currentQuantity}):`, '1');
        if (quantityToRemove === null || quantityToRemove === '') {
            return; // If user cancels or leaves prompt empty, do nothing
        }
        const parsedQuantity = parseInt(quantityToRemove, 10);
        if (isNaN(parsedQuantity) || parsedQuantity <= 0 || parsedQuantity > currentQuantity) {
            alert(`Invalid quantity. Please enter a valid number between 1 and ${currentQuantity}.`);
            return;
        }

        cart[index].quantity -= parsedQuantity;

        if (cart[index].quantity <= 0) {
            cart.splice(index, 1); // Remove item from cart if quantity is zero or less
        }

        localStorage.setItem('cart', JSON.stringify(cart)); // Update localStorage
        displayCart(); // Update cart display on the webpage

        try {
            // Prepare the data to be stored in Firestore
            const cartItems = cart.map(cartItem => ({
                id: cartItem.id,
                name: cartItem.name,
                price: cartItem.price,
                image: cartItem.image,
                quantity: cartItem.quantity,
                addedBy: cartItem.addedBy
            }));

            // Update Firestore document under 'carts/userId'
            await setDoc(doc(db, "carts", currentUser.uid), {
                items: cartItems
            });

            console.log("Cart updated in Firestore");
            alert(`${parsedQuantity} ${parsedQuantity > 1 ? 'items' : 'item'} removed from cart for user: ${currentUser.email}`);
        } catch (error) {
            console.error("Error removing item from Firestore cart:", error);
        }
    }
};

        displayCart();

        const cartModal = document.getElementById('cartModal');
        const openCartBtn = document.getElementById('open-cart');
        const closeCartBtn = document.getElementById('close-cart');

        openCartBtn.onclick = function () {
            cartModal.style.display = "block";
            displayCart();
        }

        closeCartBtn.onclick = function () {
            cartModal.style.display = "none";
        }

        window.onclick = function (event) {
            if (event.target == cartModal) {
                cartModal.style.display = "none";
            }
        }

        // Authentication functions
        const signUp = async (email, password) => {
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                console.log("User signed up:", userCredential.user);
            } catch (error) {
                console.error("Error signing up:", error);
            }
        };

        const signIn = async (email, password) => {
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log("User signed in:", userCredential.user);
            } catch (error) {
                console.error("Error signing in:", error);
            }
        };

        const signOutUser = async () => {
            try {
                await signOut(auth);
                console.log("User signed out");
            } catch (error) {
                console.error("Error signing out:", error);
            }
        };

        // Example usage
        // signUp("user@example.com", "password123");
        // signIn("user@example.com", "password123");
        // signOutUser();
    </script>


</body>

</html>
